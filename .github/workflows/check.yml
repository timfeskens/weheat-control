name: Offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  home-assistant:
    name: Home Assistant ${{ matrix.homeassistant }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        homeassistant: ['2026.10.0', '2026.11.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Install Home Assistant under test
        if: matrix.homeassistant != '2026.10.0'
        run: python -m pip install 'homeassistant==${{ matrix.homeassistant }}'
      - run: python -m pip check
      - run: ruff check custom_components tests
      - run: ruff format --check custom_components tests
      - run: python -m pytest
