set_dhw_schedule:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: weheat_control
    days:
      required: true
      example: ["monday", "tuesday"]
      selector:
        select:
          multiple: true
          translation_key: weekday
          options:
            - monday
            - tuesday
            - wednesday
            - thursday
            - friday
            - saturday
            - sunday
    periods:
      required: false
      example: '[{"start": "11:00", "end": "16:00", "temperature": 50}]'
      selector:
        object:
          multiple: true
          label_field: start
          fields:
            start:
              label: Start
              required: true
              selector:
                time:
            end:
              label: End
              required: true
              selector:
                time:
            temperature:
              label: Temperature
              required: true
              selector:
                number:
                  min: 40
                  max: 60
                  step: 0.5
                  unit_of_measurement: "°C"
                  mode: box
